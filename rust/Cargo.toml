[workspace]
resolver = "2"
members = [
    "crates/gh-core",
    "crates/gh-win32",
    "crates/gh-net",
    "crates/gh-cv",
    "crates/gh-hud",
    "crates/gh-host",
    "crates/gh-app",
    "crates/gh-sim",
]

[workspace.package]
version = "5.8.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# gh-core (pure-Rust)
zip = { version = "9", default-features = false, features = ["deflate"] }
md-5 = "0.10"

# gh-win32
windows = "0.62"

# gh-net
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
subtle = "2.6"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg", "gif"] }

# gh-hud
tiny-skia = "0.12"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }

# gh-cv
rayon = "1.12"
ndarray = "0.17"
rustfft = "6"

# gh-app
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
winresource = "0.1"

# Internal acyclic DAG crates
gh-core = { path = "crates/gh-core" }
gh-win32 = { path = "crates/gh-win32" }
gh-net = { path = "crates/gh-net" }
gh-cv = { path = "crates/gh-cv" }
gh-hud = { path = "crates/gh-hud" }
gh-app = { path = "crates/gh-app" }

# Keep third-party crates (image, rustfft, ndarray, tiny-skia, cosmic-text, zip)
# optimized during dev/test so CV & HUD tests run 10-30x faster while gh-* keeps
# fast incremental debug builds with compact line-table PDBs.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.test.package.gh-cv]
opt-level = 2

# Fast optimized profile for heavy scratch/ CV fixture benchmarks (no LTO link delay)
[profile.cv-bench]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"
debug = true
panic = "unwind"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "symbols"
debug = false
panic = "abort"
